<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Markdown Preview Test - Notix</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
                text-align: center;
            }

            .header h1 {
                margin-bottom: 10px;
            }

            .content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0;
                height: calc(100vh - 200px);
            }

            .editor-pane,
            .preview-pane {
                padding: 20px;
                overflow-y: auto;
            }

            .editor-pane {
                border-right: 2px solid #e0e0e0;
                background: #f8f9fa;
            }

            .pane-header {
                font-size: 1.2em;
                font-weight: 600;
                margin-bottom: 15px;
                color: #333;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .pane-header::before {
                content: '';
                width: 4px;
                height: 24px;
                background: #667eea;
                border-radius: 2px;
            }

            textarea {
                width: 100%;
                height: calc(100% - 50px);
                padding: 15px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                resize: none;
                line-height: 1.6;
            }

            textarea:focus {
                outline: none;
                border-color: #667eea;
            }

            #preview {
                min-height: calc(100% - 50px);
                padding: 15px;
                background: white;
                border: 2px solid #ddd;
                border-radius: 8px;
                line-height: 1.6;
            }

            /* Markdown Preview Styles - matching Notix */
            #preview h1,
            #preview h2,
            #preview h3,
            #preview h4,
            #preview h5,
            #preview h6 {
                margin: 0.75rem 0 0.5rem 0;
                font-weight: 600;
                line-height: 1.3;
            }

            #preview h1 {
                font-size: 2em;
                color: #2c3e50;
            }
            #preview h2 {
                font-size: 1.75em;
                color: #34495e;
            }
            #preview h3 {
                font-size: 1.5em;
                color: #34495e;
            }
            #preview h4 {
                font-size: 1.25em;
                color: #555;
            }
            #preview h5 {
                font-size: 1.1em;
                color: #555;
            }
            #preview h6 {
                font-size: 1em;
                color: #666;
            }

            #preview p {
                margin: 0.5rem 0;
            }

            #preview strong {
                font-weight: 600;
                color: #2c3e50;
            }

            #preview em {
                font-style: italic;
            }

            #preview del {
                text-decoration: line-through;
                opacity: 0.7;
            }

            #preview code {
                background: #f4f4f4;
                padding: 0.2rem 0.4rem;
                border-radius: 0.25rem;
                font-family: 'Courier New', monospace;
                font-size: 0.9em;
                color: #e74c3c;
            }

            #preview pre {
                background: #2d2d2d;
                color: #f8f8f2;
                padding: 1rem;
                border-radius: 0.5rem;
                overflow-x: auto;
                margin: 0.75rem 0;
            }

            #preview pre code {
                background: transparent;
                color: inherit;
                padding: 0;
                font-size: 0.95em;
            }

            #preview ul,
            #preview ol {
                margin: 0.5rem 0;
                padding-left: 2rem;
            }

            #preview ul li {
                list-style-type: disc;
                margin: 0.25rem 0;
            }

            #preview ol li {
                list-style-type: decimal;
                margin: 0.25rem 0;
            }

            #preview blockquote {
                border-left: 4px solid #3498db;
                padding-left: 1rem;
                margin: 0.75rem 0;
                color: #555;
                font-style: italic;
                background: #f8f9fa;
                padding: 0.5rem 1rem;
                border-radius: 0 0.25rem 0.25rem 0;
            }

            #preview hr {
                border: none;
                border-top: 2px solid #ddd;
                margin: 1rem 0;
            }

            #preview a {
                color: #3498db;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            #preview a:hover {
                color: #2980b9;
                text-decoration: underline;
            }

            #preview img {
                max-width: 100%;
                height: auto;
                border-radius: 0.25rem;
                margin: 0.5rem 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .toolbar {
                padding: 15px 30px;
                background: #f8f9fa;
                border-top: 2px solid #e0e0e0;
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .btn {
                padding: 8px 16px;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s ease;
            }

            .btn:hover {
                background: #5568d3;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            }

            .btn-secondary {
                background: #6c757d;
            }

            .btn-secondary:hover {
                background: #5a6268;
            }

            .info {
                margin-top: 10px;
                padding: 10px;
                background: #fff3cd;
                border-left: 4px solid #ffc107;
                border-radius: 4px;
                font-size: 14px;
            }

            @media (max-width: 768px) {
                .content {
                    grid-template-columns: 1fr;
                }

                .editor-pane {
                    border-right: none;
                    border-bottom: 2px solid #e0e0e0;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>📝 Markdown Preview Test</h1>
                <p>Test the markdown parsing functionality for Notix</p>
            </div>

            <div class="content">
                <div class="editor-pane">
                    <div class="pane-header">✍️ Editor</div>
                    <textarea
                        id="editor"
                        placeholder="Type your markdown here..."
                    >
# Welcome to Markdown Preview! 🎉

## Features

This preview supports:

- **Bold text** and *italic text*
- ~~Strikethrough~~
- [Links](https://example.com)
- Images (paste with Ctrl+V)

### Code Examples

Inline code: `const x = 10`

Code block:
```
function hello() {
    return "Hello World!"
}
```

### Lists

#### Unordered List
- Item 1
- Item 2
- Item 3

#### Ordered List
1. First
2. Second
3. Third

### Blockquotes

> This is a blockquote
> It can span multiple lines

---

### Try it yourself!

Edit this text to see live preview updates ⚡</textarea
                    >
                </div>

                <div class="preview-pane">
                    <div class="pane-header">👁️ Preview</div>
                    <div id="preview"></div>
                </div>
            </div>

            <div class="toolbar">
                <button class="btn" onclick="insertMarkdown('**', '**')">
                    Bold
                </button>
                <button class="btn" onclick="insertMarkdown('*', '*')">
                    Italic
                </button>
                <button class="btn" onclick="insertMarkdown('~~', '~~')">
                    Strike
                </button>
                <button class="btn" onclick="insertMarkdown('`', '`')">
                    Code
                </button>
                <button
                    class="btn"
                    onclick="insertMarkdown('\n```\n', '\n```')"
                >
                    Code Block
                </button>
                <button class="btn" onclick="insertMarkdown('[', '](url)')">
                    Link
                </button>
                <button class="btn" onclick="insertHeader()">Header</button>
                <button class="btn" onclick="insertList()">List</button>
                <button class="btn btn-secondary" onclick="clearEditor()">
                    Clear
                </button>
                <button class="btn btn-secondary" onclick="loadSample()">
                    Sample
                </button>
            </div>

            <div class="info">
                💡 <strong>Tip:</strong> This uses the same markdown parser as
                Notix. Type in the editor to see real-time preview!
            </div>
        </div>

        <script type="module">
            // Inline markdown parser (same logic as Notix)
            const parseMarkdown = (markdown) => {
                if (!markdown) return ''

                let html = markdown

                const escapeHtml = (text) => {
                    const map = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;',
                    }
                    return text.replace(/[&<>"']/g, (m) => map[m])
                }

                const codeBlocks = []
                html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
                    const placeholder = `___CODE_BLOCK_${codeBlocks.length}___`
                    codeBlocks.push(
                        `<pre><code>${escapeHtml(code.trim())}</code></pre>`
                    )
                    return placeholder
                })

                const inlineCodes = []
                html = html.replace(/`([^`]+)`/g, (match, code) => {
                    const placeholder = `___INLINE_CODE_${inlineCodes.length}___`
                    inlineCodes.push(`<code>${escapeHtml(code)}</code>`)
                    return placeholder
                })

                html = html.replace(
                    /!\[([^\]]*)\]\(([^)]+)\)/g,
                    '<img src="$2" alt="$1" />'
                )
                html = html.replace(
                    /\[([^\]]+)\]\(([^)]+)\)/g,
                    '<a href="$2" target="_blank">$1</a>'
                )

                html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>')
                html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>')
                html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>')
                html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
                html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
                html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>')

                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>')
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>')
                html = html.replace(/_([^_]+)_/g, '<em>$1</em>')
                html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>')

                html = html.replace(/^---$/gm, '<hr />')
                html = html.replace(/^\*\*\*$/gm, '<hr />')

                html = html.replace(/^\s*[-*+]\s+(.+)$/gm, '<li>$1</li>')
                html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')

                html = html.replace(/^\s*\d+\.\s+(.+)$/gm, '<li>$1</li>')
                html = html.replace(
                    /^>\s+(.+)$/gm,
                    '<blockquote>$1</blockquote>'
                )

                html = html.replace(/\n\n/g, '</p><p>')
                html = html.replace(/\n/g, '<br />')
                html = `<p>${html}</p>`

                html = html.replace(/<p><\/p>/g, '')
                html = html.replace(/<p>(<h[1-6]>)/g, '$1')
                html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1')
                html = html.replace(/<p>(<ul>)/g, '$1')
                html = html.replace(/(<\/ul>)<\/p>/g, '$1')
                html = html.replace(/<p>(<blockquote>)/g, '$1')
                html = html.replace(/(<\/blockquote>)<\/p>/g, '$1')
                html = html.replace(/<p>(<hr \/>)/g, '$1')
                html = html.replace(/(<hr \/>)<\/p>/g, '$1')
                html = html.replace(/<p>(<pre>)/g, '$1')
                html = html.replace(/(<\/pre>)<\/p>/g, '$1')

                codeBlocks.forEach((block, index) => {
                    html = html.replace(`___CODE_BLOCK_${index}___`, block)
                })

                inlineCodes.forEach((code, index) => {
                    html = html.replace(`___INLINE_CODE_${index}___`, code)
                })

                return html
            }

            const editor = document.getElementById('editor')
            const preview = document.getElementById('preview')

            const updatePreview = () => {
                const markdown = editor.value
                const html = parseMarkdown(markdown)
                preview.innerHTML = html
            }

            editor.addEventListener('input', updatePreview)
            updatePreview()

            // Helper functions for toolbar
            window.insertMarkdown = (before, after) => {
                const start = editor.selectionStart
                const end = editor.selectionEnd
                const text = editor.value
                const selected = text.substring(start, end)
                editor.value =
                    text.substring(0, start) +
                    before +
                    selected +
                    after +
                    text.substring(end)
                editor.focus()
                editor.setSelectionRange(
                    start + before.length,
                    end + before.length
                )
                updatePreview()
            }

            window.insertHeader = () => {
                const start = editor.selectionStart
                const text = editor.value
                editor.value =
                    text.substring(0, start) +
                    '\n## Header\n' +
                    text.substring(start)
                updatePreview()
            }

            window.insertList = () => {
                const start = editor.selectionStart
                const text = editor.value
                editor.value =
                    text.substring(0, start) +
                    '\n- Item 1\n- Item 2\n- Item 3\n' +
                    text.substring(start)
                updatePreview()
            }

            window.clearEditor = () => {
                editor.value = ''
                updatePreview()
            }

            window.loadSample = () => {
                editor.value = `# Sample Document 📄

## Table of Contents
1. Introduction
2. Features
3. Examples

---

## Introduction

Welcome to the **Markdown Preview** test! This parser supports most common markdown syntax.

## Features

### Text Formatting
- **Bold text** with double asterisks
- *Italic text* with single asterisk
- ~~Strikethrough~~ with tildes
- \`Inline code\` with backticks

### Links and Images
Check out [GitHub](https://github.com) for more!

### Code Blocks
\`\`\`
function greet(name) {
    console.log("Hello, " + name + "!")
}
\`\`\`

### Lists

#### Shopping List
- Milk
- Eggs
- Bread

#### Priority Tasks
1. Fix bugs
2. Write docs
3. Deploy

### Blockquotes

> "The best way to predict the future is to invent it."
> - Alan Kay

---

## Try It Yourself! ✨

Edit this text to see the preview update in real-time!`
                updatePreview()
            }
        </script>
    </body>
</html>
